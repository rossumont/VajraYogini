<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vajrayogini Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Tibetan&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#170b0d; --bg2:#21100f; --card:#2b1517; --card2:#361b1d; --line:#4a2629;
  --red:#c42a3c; --red2:#8e1c2a; --gold:#e0ac4a; --gold2:#a87a2a;
  --text:#f5ebde; --mute:#c2ab98; --ok:#5fae6e; --warn:#e08a2a; --bad:#d24a4a;
  --blue:#4a7bd8; --yellow:#e2c13a; --green:#3fa35a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold2)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(1200px 600px at 50% -10%,#3a1418 0%,transparent 60%),var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:rgba(23,11,13,.85);backdrop-filter:blur(6px)}
.logo{width:34px;height:34px;flex:none}
header h1{font-family:"Cormorant Garamond",serif;font-size:1.35rem;letter-spacing:.5px;color:var(--gold);flex:1;line-height:1.1}
header h1 small{display:block;font-family:"Noto Sans Thai",sans-serif;font-size:.72rem;color:var(--mute);letter-spacing:0;font-weight:400}
.hbtn{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;background:var(--card)}
.hbtn:hover{border-color:var(--gold2)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;max-width:860px;margin:0 auto;padding:16px 14px 28px}
.page.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:rgba(23,11,13,.95);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mute)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
h2{font-size:1.25rem;margin:4px 0 12px;color:var(--gold)}
h3{font-size:1.05rem;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:var(--gold2)}
.btn.pri{background:linear-gradient(180deg,var(--red),var(--red2));border-color:var(--red)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1306;border-color:var(--gold)}
.btn.danger{background:#4a1518;border-color:var(--bad);color:#ffd9d9}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.92rem;display:flex;gap:8px;align-items:center}
.banner.ok{background:#1d2a1e;border:1px solid #2f5a35}
.banner.warn{background:#3a250f;border:1px solid var(--warn);color:#ffd9a8}
.stat{flex:1;min-width:130px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;color:var(--gold)}
.stat span{font-size:.8rem;color:var(--mute)}
.bar{height:12px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--red);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:88px}
.tile:hover{border-color:var(--gold2)}
.tile .n{font-size:.78rem;color:var(--gold);font-weight:700}
.tile .t{font-weight:600;line-height:1.3}
.tile .s{font-size:.78rem;color:var(--mute)}
.mantra{background:linear-gradient(180deg,#3a1a10,#2b1410);border:1px solid var(--gold2);border-radius:12px;padding:10px 12px;margin:8px 0;
  font-weight:600;letter-spacing:.3px;color:#ffe2a8;word-break:break-word}
.mantra .lb{display:block;font-size:.75rem;color:var(--mute);font-weight:400;letter-spacing:0;margin-bottom:3px}
.tib{font-family:"Noto Serif Tibetan",serif;font-size:1.35rem;line-height:1.9;font-weight:400}
.th{background:#1f1a12;border-left:3px solid var(--gold);padding:8px 12px;border-radius:8px;margin:8px 0 12px;font-size:.93rem}
.flow{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92rem;color:#f0d9c0}
.step ul{margin:6px 0 8px 20px}
.step li{margin:3px 0}
.step p{margin:6px 0}
.step h4{margin:14px 0 6px;color:var(--gold);font-size:1rem}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--card2);color:var(--gold)}
.tblwrap{overflow-x:auto}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.pics figure{background:#fff;border-radius:10px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column}
.pics figure:only-child{grid-column:1/-1}
.pics figure:only-child img{height:auto;max-height:340px}
.pics img{width:100%;height:150px;object-fit:contain;background:#fff;display:block}
.pics figcaption{font-size:.75rem;color:#3a2a20;padding:5px 7px;line-height:1.3;background:#f4ece0;flex:1}
#modal .box img{max-height:70vh;object-fit:contain}
.same{background:#22201a;border:1px solid var(--gold2);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9rem}
.stepnav{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.stepnav .btn{flex:1}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:10px;
  background:var(--bg2);border:1px solid var(--line);font-weight:700;margin:3px}
.chip.done{background:var(--ok);border-color:var(--ok);color:#06210b}
.sess{border-left:4px solid var(--line)}
.sess.done{border-left-color:var(--ok)}
.tap{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;margin:8px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,#e0485a,#8e1c2a 70%);border:4px solid var(--gold2);box-shadow:0 0 40px rgba(196,42,60,.35);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tap:active{transform:scale(.97)}
.tap b{font-size:2.6rem;line-height:1}
.tap span{font-size:.85rem;opacity:.9}
.list .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:none}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{width:38px;text-align:center;font-size:.7rem;color:var(--mute)}
.day i{display:block;height:26px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);margin-bottom:2px}
.day i.p{background:#6a4a1a;border-color:var(--gold2)}
.day i.f{background:var(--ok);border-color:var(--ok)}
label.fld{display:block;margin:10px 0 4px;font-size:.88rem;color:var(--mute)}
.help h3{color:var(--gold)}
.help li{margin:4px 0 4px 18px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--gold2);border-radius:16px;max-width:460px;width:100%;padding:18px;max-height:90vh;overflow:auto}
#modal .box h3{margin-top:0;color:var(--gold)}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold2);padding:9px 16px;border-radius:999px;
  font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
/* lock */
#lock{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 500px at 50% 20%,#3d1418,transparent 70%),var(--bg)}
#lock.on{display:flex}
#lock .box{max-width:420px;width:100%;text-align:center}
#lock .box .card{text-align:left}
#lock h2{font-family:"Cormorant Garamond",serif;font-size:1.8rem;margin-top:8px}
.notice{font-size:.88rem;color:#ffd9a8;background:#3a250f;border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:12px 0;text-align:left}
.err{color:#ff9a9a;font-size:.88rem;min-height:1.3em;margin-top:6px}
@media (min-width:900px){ .page{padding-top:24px} }
</style>
</head>

<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#e0ac4a" stroke-width="3"/>

      <polygon points="50,86 18,30 82,30" fill="none" stroke="#e0ac4a" stroke-width="4"/>
      <circle cx="50" cy="50" r="6" fill="#c42a3c"/>

    <h1><span data-t="appName"></span><small data-t="appSub"></small></h1>

  <main id="main">

    <section class="page" id="p-guide"></section>

    <section class="page" id="p-set"></section>
    <section class="page" id="p-help"></section>

  <nav id="nav"></nav>
</div>

<div id="lock"><div class="box" id="lockBox"></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

const KEY='vajrayogini_app_v1', LOCKKEY='vajrayogini_lock_v1', APPID='vajrayogini-practice';
const DEF_MANTRAS=[
  {id:'triple',name:'Triple OM mantra (long)',goal:400000,main:true},
  {id:'short',name:'Short mantra',goal:0},
  {id:'harinisa',name:'Vajrayogini mantra (HARINISA) – Inner',goal:0}
];
function defData(){return{v:1,counts:[],log:{},settings:{lang:'en',mala:108,plan:'1',schedMode:'outer',
  mantras:JSON.parse(JSON.stringify(DEF_MANTRAS)),curMantra:'triple',lastBackup:null}}}
let D;
function load(){
  try{const r=localStorage.getItem(KEY); D=r?JSON.parse(r):defData();}catch(e){D=defData();}
  const d=defData(); D.counts=Array.isArray(D.counts)?D.counts:[]; D.log=D.log&&typeof D.log==='object'?D.log:{};
  D.settings=Object.assign(d.settings,D.settings||{});
  if(!Array.isArray(D.settings.mantras)||!D.settings.mantras.length) D.settings.mantras=d.settings.mantras;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('⚠ Save failed / บันทึกไม่สำเร็จ');}}
let IMGS={};
const KEYSTORE='vajrayogini_key_v1';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const normPw=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
async function keyFromPw(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPw(pw)),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function openContent(key){const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.iv)},key,b64d(ENC.ct));
  const o=JSON.parse(new TextDecoder().decode(buf));OUTER=o.OUTER;INNER=o.INNER;IMGS=o.IMG||{};}
function forgetKey(){try{localStorage.removeItem(KEYSTORE);}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function fmtDate(s){const d=typeof s==='string'?parseYmd(s):s;
  return D.settings.lang==='th'?d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})
  :d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fmtDT(iso){const d=new Date(iso);return fmtDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
const nf=n=>Number(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= UI HELPERS ================= */
const $=s=>document.querySelector(s);
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
function modal(html,acts){const b=$('#modalBox');b.innerHTML=html+'<div class="acts"></div>';const a=b.querySelector('.acts');
  (acts||[{l:t('close')}]).forEach(x=>{const bt=document.createElement('button');bt.className='btn '+(x.c||'');bt.textContent=x.l;
   bt.onclick=()=>{if(x.f&&x.f()===false)return;closeModal();};a.appendChild(bt);});$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
function confirmBox(msg,onYes,yesLabel,danger){modal('<h3>'+esc(t('ok'))+'?</h3><p>'+esc(msg)+'</p>',
  [{l:t('cancel')},{l:yesLabel||t('ok'),c:danger?'danger':'pri',f:onYes}]);}

/* ================= LOCK ================= */
let unlocked=false;
function showLock(){
  const box=$('#lockBox');$('#lock').classList.add('on');
  const head='<svg viewBox="0 0 100 100" width="72" height="72"><circle cx="50" cy="50" r="47" fill="none" stroke="#e0ac4a" stroke-width="3"/><polygon points="50,14 82,70 18,70" fill="none" stroke="#c42a3c" stroke-width="4"/><polygon points="50,86 18,30 82,30" fill="none" stroke="#e0ac4a" stroke-width="4"/><circle cx="50" cy="50" r="6" fill="#c42a3c"/></svg><h2>'+esc(t('appName'))+'</h2>'+
   '<div class="row" style="justify-content:center;margin:6px 0"><button class="hbtn" id="lkLang">'+(D.settings.lang==='en'?'ไทย':'English')+'</button></div>'+
   '<div class="notice">'+esc(t('restricted'))+'</div>';
  if(!(window.crypto&&crypto.subtle)){box.innerHTML=head+'<div class="card"><p>'+esc(t('noCrypto'))+'</p></div>';}
  else{
  box.innerHTML=head+'<div class="card"><label class="fld" style="margin-top:0">'+esc(t('enterPass'))+'</label><input type="password" id="lp" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">'+
    '<label class="row" style="margin-top:12px;gap:8px"><input type="checkbox" id="lrem" style="width:auto"> <span>'+esc(t('remember'))+'</span></label>'+
    '<div class="err" id="lerr"></div><button class="btn pri" id="lgo" style="width:100%">'+esc(t('enter'))+'</button>'+
    '<p class="muted" style="margin-top:10px;font-size:.82rem">'+esc(t('pwNote'))+'</p></div>';
  const goF=async()=>{const btn=$('#lgo');btn.disabled=true;$('#lerr').textContent='…';
    try{const k=await keyFromPw($('#lp').value);await openContent(k);
      if($('#lrem').checked){try{localStorage.setItem(KEYSTORE,b64e(await crypto.subtle.exportKey('raw',k)));}catch(e){}}
      unlock();}
    catch(e){$('#lerr').textContent=t('wrong');btn.disabled=false;$('#lp').select();}};
  $('#lgo').onclick=goF;$('#lp').onkeydown=e=>{if(e.key==='Enter')goF();};setTimeout(()=>$('#lp')&&$('#lp').focus(),50);
  }
  $('#lkLang').onclick=()=>{D.settings.lang=D.settings.lang==='en'?'th':'en';save();showLock();};
}
async function tryRemembered(){let s=null;try{s=localStorage.getItem(KEYSTORE);}catch(e){}
  if(!s||!(window.crypto&&crypto.subtle))return false;
  try{const k=await crypto.subtle.importKey('raw',b64d(s),{name:'AES-GCM'},false,['decrypt']);await openContent(k);return true;}
  catch(e){forgetKey();return false;}}
function unlock(){unlocked=true;$('#lock').classList.remove('on');$('#lockBox').innerHTML='';renderAll();}
function lockNow(){unlocked=false;forgetKey();OUTER=[];INNER=[];IMGS={};G.step=null;G.seq=null;
  ['#p-home','#p-guide','#p-count','#p-sched','#p-set','#p-help'].forEach(s=>$(s).innerHTML='');showLock();}

/* ================= DATA HELPERS ================= */
const mantraById=id=>D.settings.mantras.find(m=>m.id===id);
function totalOf(id){return D.counts.filter(c=>c.m===id).reduce((a,c)=>a+(+c.n||0),0);}
function todayOf(id){const d=ymd();return D.counts.filter(c=>c.m===id&&c.d===d).reduce((a,c)=>a+(+c.n||0),0);}
function addTap(id,n){const d=ymd();let e=D.counts.find(c=>c.m===id&&c.d===d&&c.src==='tap');
  if(!e){if(n<0)return;e={id:uid(),m:id,d,n:0,src:'tap',ts:new Date().toISOString()};D.counts.push(e);}
  e.n=Math.max(0,e.n+n);e.ts=new Date().toISOString();if(e.n===0)D.counts=D.counts.filter(x=>x!==e);save();}
function dayLog(d){d=d||ymd();if(!D.log[d])D.log[d]={plan:D.settings.plan,done:{}};return D.log[d];}
function planOf(d){const l=D.log[d];return PLANS[(l&&l.plan)||D.settings.plan]||PLANS['1'];}
function sessDone(d,i){const l=D.log[d];if(!l)return false;const p=planOf(d);return p.s[i].every(n=>l.done[i+'-'+n]);}
function daySummary(d){const p=planOf(d);let full=0;p.s.forEach((_,i)=>{if(sessDone(d,i))full++;});
  const l=D.log[d];const any=l&&Object.values(l.done).some(Boolean);return{full,total:p.s.length,any};}
function backupInfo(){const lb=D.settings.lastBackup;if(!lb)return{cls:'warn',txt:t('never')+' '+t('backupOld')};
  const days=Math.floor((Date.now()-new Date(lb).getTime())/864e5);
  return{cls:days>7?'warn':'ok',txt:t('lastBackup')+' '+fmtDT(lb)+' ('+(days===0?t('today'):days+' '+t('daysAgo'))+')'+(days>7?' '+t('backupOld'):'')};}

/* ================= GUIDE ================= */
const G={mode:'outer',step:null,seq:null,seqIdx:0,sessIdx:null};
function steps(){return G.mode==='inner'?INNER:OUTER;}
function stepBy(n,mode){return (mode==='inner'?INNER:OUTER).find(s=>s.n===n);}
function blocksHtml(bl){return bl.map(b=>{
  if(b.p)return '<p>'+esc(b.p)+'</p>';
  if(b.h)return '<h4>'+esc(b.h)+'</h4>';
  if(b.ul)return '<ul>'+b.ul.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(b.flow)return '<div class="flow">'+esc(b.flow)+'</div>';
  if(b.m)return '<div class="mantra"><span class="lb">'+esc(b.l||t('mantra'))+'</span>'+esc(b.m).replace(/\n/g,'<br>')+
    (b.tibet?'<div class="tib">'+esc(b.tibet)+'</div>':'')+
    (b.count?'<div style="margin-top:8px"><button class="btn sm gold" data-cnt="'+b.count+'">📿 '+esc(t('openCount'))+'</button></div>':'')+'</div>';
  if(b.imgs)return '<div class="pics">'+b.imgs.filter(x=>IMGS[x[0]]).map(x=>'<figure><img src="'+IMGS[x[0]]+'" alt="'+esc(x[1])+'" loading="lazy" data-zoom="'+x[0]+'"><figcaption>'+esc(x[1])+'</figcaption></figure>').join('')+'</div>';
  if(b.tbl)return '<div class="tblwrap"><table><tr>'+b.tbl.h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+b.tbl.r.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table></div>';
  return '';}).join('');}
function rGuide(){
  const P=$('#p-guide');
  const seg='<div class="seg" style="margin-bottom:14px"><button data-m="outer" class="'+(G.mode==='outer'?'on':'')+'">'+esc(t('outer'))+'</button><button data-m="inner" class="'+(G.mode==='inner'?'on':'')+'">'+esc(t('inner'))+'</button></div>';
  if(G.step==null){
    P.innerHTML=seg+'<div class="tiles">'+steps().map(s=>'<button class="tile" data-s="'+s.n+'"><span class="n">'+(s.n?('No. '+s.n):'●')+'</span><span class="t">'+esc(L(s.t))+'</span><span class="s">'+esc(L(s.s))+'</span></button>').join('')+'</div>';
    P.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{G.step=+b.dataset.s;G.seq=null;rGuide();$('#main').scrollTop=0;});
  }else{
    const s=stepBy(G.step,G.mode)||steps()[0];let body='';
    body+='<div class="th"><b>'+esc(t('thSum'))+':</b> '+esc(s.th)+'</div>';
    if(G.mode==='inner'&&s.same){
      body+=blocksHtml(s.b)+'<div class="same">↪ '+esc(t('sameAs'))+'</div>'+blocksHtml(stepBy(s.same,'outer').b);
    }else{
      body+=blocksHtml(s.b);
      if(G.mode==='inner'&&s.plus)body+='<div class="same">↪ '+esc(t('plusOuter'))+' <button class="btn sm" data-vo="'+s.plus+'">'+esc(t('viewOuter'))+' '+s.plus+'</button></div>';
    }
    let navH,head;
    if(G.seq){
      const p=PLANS[D.settings.plan];const sname=p.names?L(p.names[G.sessIdx]):(t('session')+' '+(G.sessIdx+1));
      head='<div class="banner ok"><span class="grow">🧘 '+esc(t('practiceMode'))+' · '+esc(sname)+' · '+esc(t('stepOf'))+' '+(G.seqIdx+1)+' '+esc(t('of'))+' '+G.seq.length+'</span><button class="btn sm" id="gExit">✕ '+esc(t('exitSess'))+'</button></div>';
      const last=G.seqIdx===G.seq.length-1;
      navH='<div class="stepnav"><button class="btn" id="gPrev" '+(G.seqIdx===0?'disabled':'')+'>'+esc(t('prev'))+'</button>'+
       (last?'<button class="btn gold" id="gFin">'+esc(t('finishSess'))+'</button>':'<button class="btn pri" id="gNext">'+esc(t('next'))+'</button>')+'</div>';
    }else{
      head=seg+'<button class="btn sm" id="gList" style="margin-bottom:10px">'+esc(t('toList'))+'</button>';
      const list=steps(),i=list.findIndex(x=>x.n===s.n);
      navH='<div class="stepnav"><button class="btn" id="gPrev" '+(i<=0?'disabled':'')+'>'+esc(t('prev'))+'</button><button class="btn pri" id="gNext" '+(i>=list.length-1?'disabled':'')+'>'+esc(t('next'))+'</button></div>';
    }
    P.innerHTML=head+'<div class="card step"><div class="muted">'+esc(G.mode==='inner'?t('inner'):t('outer'))+(s.n?' · No. '+s.n:'')+'</div><h2 style="margin:2px 0 6px">'+esc(L(s.t))+'</h2>'+body+'</div>'+navH;
    P.querySelectorAll('[data-zoom]').forEach(im=>im.onclick=()=>modal('<img src="'+im.src+'" style="width:100%;border-radius:10px;background:#fff"><p class="muted" style="margin-top:8px">'+esc(im.alt)+'</p>'));
    const gx=$('#gExit');if(gx)gx.onclick=()=>{G.seq=null;G.step=null;rGuide();};const gl=$('#gList');if(gl)gl.onclick=()=>{G.step=null;rGuide();};
    P.querySelectorAll('[data-vo]').forEach(b=>b.onclick=()=>{G.mode='outer';G.step=+b.dataset.vo;G.seq=null;rGuide();$('#main').scrollTop=0;});
    P.querySelectorAll('[data-cnt]').forEach(b=>b.onclick=()=>{if(mantraById(b.dataset.cnt)){D.settings.curMantra=b.dataset.cnt;save();}go('count');});
    const mv=d=>{if(G.seq){G.seqIdx+=d;G.step=G.seq[G.seqIdx];
        const l=dayLog();l.done[G.sessIdx+'-'+G.seq[G.seqIdx-d]]=true;save();}
      else{const list=steps(),i=list.findIndex(x=>x.n===s.n);G.step=list[i+d].n;}rGuide();$('#main').scrollTop=0;};
    const pv=$('#gPrev');if(pv)pv.onclick=()=>{if(G.seq){G.seqIdx--;G.step=G.seq[G.seqIdx];rGuide();$('#main').scrollTop=0;}else mv(-1);};
    const nx=$('#gNext');if(nx)nx.onclick=()=>mv(1);
    const fn=$('#gFin');if(fn)fn.onclick=()=>{const l=dayLog();G.seq.forEach(n=>l.done[G.sessIdx+'-'+n]=true);save();G.seq=null;G.step=null;toast(t('sessFinished'));go('sched');};
  }
  P.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{G.mode=b.dataset.m;G.seq=null;if(G.step!=null&&!stepBy(G.step,G.mode))G.step=null;rGuide();});
}

/* ================= COUNT ================= */
function rCount(){
  const ms=D.settings.mantras;let m=mantraById(D.settings.curMantra)||ms[0];D.settings.curMantra=m.id;
  const tot=totalOf(m.id),g=+m.goal||0,pct=g?Math.min(100,tot/g*100):0,td=todayOf(m.id);
  // average over last 30 days with counts
  const since=new Date();since.setDate(since.getDate()-29);const sy=ymd(since);const per={};
  D.counts.filter(c=>c.m===m.id&&c.d>=sy).forEach(c=>per[c.d]=(per[c.d]||0)+(+c.n||0));
  const dd=Object.keys(per).filter(k=>per[k]>0);const avg=dd.length?Object.values(per).reduce((a,b)=>a+b,0)/dd.length:0;
  let eta=t('noEta');if(g&&tot>=g)eta='✓ 100%';else if(g&&avg>0&&dd.length>=2){const e=new Date();e.setDate(e.getDate()+Math.ceil((g-tot)/avg));eta=fmtDate(e);}
  let rec='';if(m.main&&g){rec='<div class="card"><b>'+esc(t('nextRec'))+'</b><p class="muted" style="margin-top:4px">'+esc(pct>=100?t('rec100'):pct>=50?t('rec50'):t('rec0'))+'</p></div>';}
  const recent=D.counts.filter(c=>c.m===m.id).sort((a,b)=>(b.d+b.ts).localeCompare(a.d+a.ts)).slice(0,20);
  const mala=+D.settings.mala||108;
  $('#p-count').innerHTML=
  '<label class="fld" style="margin-top:0">'+esc(t('mantra'))+'</label><select id="cM">'+ms.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===m.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'+
  '<button class="tap" id="cTap"><b id="cTd">'+nf(td)+'</b><span>'+esc(t('todayCount'))+' · '+esc(t('tapHint'))+'</span></button>'+
  '<div class="row" style="justify-content:center;margin-bottom:12px"><button class="btn" id="cUndo">'+esc(t('undo'))+'</button><button class="btn gold" id="cMala">'+esc(t('addMala'))+' ('+mala+')</button></div>'+
  '<div class="card"><div class="row"><div class="stat"><b>'+nf(tot)+'</b><span>'+esc(t('total'))+'</span></div>'+
   (g?'<div class="stat"><b>'+nf(Math.max(0,g-tot))+'</b><span>'+esc(t('remaining'))+'</span></div><div class="stat"><b>'+pct.toFixed(2)+'%</b><span>'+esc(t('goal'))+' '+nf(g)+'</span></div>':'')+'</div>'+
   (g?'<div class="bar" style="margin-top:10px"><i style="width:'+pct+'%"></i></div>':'<p class="muted" style="margin-top:8px">'+esc(t('noGoal'))+'</p>')+
   '<div class="row" style="margin-top:10px"><div class="stat"><b>'+nf(Math.round(avg))+'</b><span>'+esc(t('avgDay'))+'</span></div>'+(g?'<div class="stat"><b style="font-size:1.05rem">'+esc(eta)+'</b><span>'+esc(t('eta'))+'</span></div>':'')+'</div></div>'+
  rec+
  '<div class="card"><b>'+esc(t('manual'))+'</b><div class="row" style="margin-top:8px"><div class="grow"><label class="fld">'+esc(t('date'))+'</label><input type="date" id="cD" value="'+ymd()+'" max="'+ymd()+'"></div>'+
   '<div class="grow"><label class="fld">'+esc(t('number'))+'</label><input type="number" id="cN" min="1" inputmode="numeric" placeholder="108"></div></div>'+
   '<button class="btn pri" id="cAdd" style="margin-top:10px;width:100%">'+esc(t('add'))+'</button></div>'+
  '<div class="card"><b>'+esc(t('recent'))+'</b><div class="list">'+(recent.length?recent.map(c=>'<div class="it"><div class="grow"><b>'+nf(c.n)+'</b> <span class="muted">· '+esc(fmtDate(c.d))+(c.src==='tap'?' · 📿':'')+'</span></div><button class="btn sm danger" data-del="'+c.id+'">'+esc(t('del'))+'</button></div>').join(''):'<p class="muted">'+esc(t('none'))+'</p>')+'</div></div>';
  $('#cM').onchange=e=>{D.settings.curMantra=e.target.value;save();rCount();};
  $('#cTap').onclick=()=>{addTap(m.id,1);$('#cTd').textContent=nf(todayOf(m.id));if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
    clearTimeout(rCount._t);rCount._t=setTimeout(rCount,900);};
  $('#cUndo').onclick=()=>{addTap(m.id,-1);rCount();};
  $('#cMala').onclick=()=>{addTap(m.id,mala);toast('+'+mala);rCount();};
  $('#cAdd').onclick=()=>{const n=parseInt($('#cN').value,10),d=$('#cD').value;if(!n||n<1||!d)return toast('⚠ '+t('number'));
    D.counts.push({id:uid(),m:m.id,d,n,src:'manual',ts:new Date().toISOString()});save();toast('+'+nf(n));rCount();};
  $('#p-count').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox(t('delQ'),()=>{D.counts=D.counts.filter(c=>c.id!==b.dataset.del);save();rCount();},t('del'),true));

/* ================= SCHEDULE ================= */
function rSched(){
  const d=ymd();const l=D.log[d];const pk=(l&&l.plan)||D.settings.plan;const p=PLANS[pk]||PLANS['1'];
  let h='<label class="fld" style="margin-top:0">'+esc(t('plan'))+'</label><select id="sP">'+Object.keys(PLANS).map(k=>'<option value="'+k+'" '+(k===pk?'selected':'')+'>'+esc(L(PLANS[k]))+'</option>').join('')+'</select>'+
   '<label class="fld">'+esc(t('useMode'))+'</label><div class="seg" style="margin-bottom:12px"><button data-sm="outer" class="'+(D.settings.schedMode==='outer'?'on':'')+'">'+esc(t('outer'))+'</button><button data-sm="inner" class="'+(D.settings.schedMode==='inner'?'on':'')+'">'+esc(t('inner'))+'</button></div>'+
   '<h3>'+esc(fmtDate(d))+'</h3><p class="muted" style="margin-bottom:8px">'+esc(t('tapChip'))+'</p>';
  p.s.forEach((arr,i)=>{const done=sessDone(d,i);const nm=p.names?L(p.names[i]):(t('session')+' '+(i+1));
    h+='<div class="card sess '+(done?'done':'')+'"><div class="row"><b class="grow">'+(done?'✅ ':'')+esc(nm)+'</b><button class="btn sm pri" data-st="'+i+'">'+esc(t('start'))+'</button></div><div style="margin-top:6px">'+
     arr.map(n=>'<button class="chip '+(l&&l.done[i+'-'+n]?'done':'')+'" data-ch="'+i+'-'+n+'" title="'+esc(L(stepBy(n,'outer').t))+'">'+n+'</button>').join('')+'</div>'+
     '<div class="muted" style="font-size:.8rem;margin-top:4px">'+arr.map(n=>n+' '+L(stepBy(n,'outer').t)).join(' · ')+'</div>'+
     '<div class="row" style="margin-top:8px"><button class="btn sm" data-all="'+i+'">'+esc(t('markAll'))+'</button><button class="btn sm" data-clr="'+i+'">'+esc(t('clear'))+'</button></div></div>';});
  // last 14 days
  let days='';for(let k=13;k>=0;k--){const x=new Date();x.setDate(x.getDate()-k);const s=ymd(x);const sm=daySummary(s);
    const cls=sm.full===sm.total&&sm.total>0&&D.log[s]?'f':sm.any?'p':'';days+='<div class="day"><i class="'+cls+'"></i>'+x.getDate()+'</div>';}
  h+='<div class="card"><b>'+esc(t('last14'))+'</b><div class="days" style="margin-top:8px">'+days+'</div><div class="muted" style="font-size:.8rem;margin-top:6px">🟩 '+esc(t('legendF'))+' · 🟨 '+esc(t('legendP'))+'</div></div>'+
   '<div class="card muted">'+esc(t('dailyNote'))+'</div>';
  $('#p-sched').innerHTML=h;
  $('#sP').onchange=e=>{D.settings.plan=e.target.value;const lg=dayLog(d);lg.plan=e.target.value;lg.done={};save();rSched();};
  $('#p-sched').querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{D.settings.schedMode=b.dataset.sm;save();rSched();});
  $('#p-sched').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const lg=dayLog(d);lg.plan=pk;lg.done[b.dataset.ch]=!lg.done[b.dataset.ch];save();rSched();});
  $('#p-sched').querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{const lg=dayLog(d);lg.plan=pk;const i=+b.dataset.all;p.s[i].forEach(n=>lg.done[i+'-'+n]=true);save();rSched();});
  $('#p-sched').querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const lg=dayLog(d);const i=+b.dataset.clr;p.s[i].forEach(n=>delete lg.done[i+'-'+n]);save();rSched();});
  $('#p-sched').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const i=+b.dataset.st;D.settings.plan=pk;const lg=dayLog(d);lg.plan=pk;save();
    G.mode=D.settings.schedMode;G.seq=p.s[i].slice();G.seqIdx=0;G.sessIdx=i;G.step=G.seq[0];go('guide');});
}

/* ================= SETTINGS ================= */
function rSet(){
  const ms=D.settings.mantras;
  $('#p-set').innerHTML=
  '<div class="card"><b>'+esc(t('sLang'))+'</b><div class="seg" style="margin-top:8px"><button data-l="en" class="'+(D.settings.lang==='en'?'on':'')+'">English</button><button data-l="th" class="'+(D.settings.lang==='th'?'on':'')+'">ไทย</button></div></div>'+
  '<div class="card"><label class="fld" style="margin-top:0"><b>'+esc(t('sMala'))+'</b></label><div class="row"><input type="number" id="sMa" min="1" value="'+(+D.settings.mala||108)+'" class="grow" style="width:auto"><button class="btn pri" id="sMaS">'+esc(t('sSave'))+'</button></div></div>'+
  '<div class="card"><b>'+esc(t('sMantras'))+'</b>'+ms.map((m,i)=>'<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><label class="fld">'+esc(t('sName'))+'</label><input data-mn="'+i+'" value="'+esc(m.name)+'">'+
   '<div class="row"><div class="grow"><label class="fld">'+esc(t('sGoal'))+'</label><input type="number" min="0" data-mg="'+i+'" value="'+(+m.goal||0)+'"></div>'+
   (m.main?'':'<button class="btn sm danger" data-md="'+i+'" style="margin-top:28px">'+esc(t('del'))+'</button>')+'</div></div>').join('')+
   '<div class="row" style="margin-top:12px"><button class="btn" id="sAddM">'+esc(t('sAddM'))+'</button><button class="btn pri grow" id="sSaveM">'+esc(t('sSave'))+'</button></div></div>'+
  '<div class="card"><b>'+esc(t('sDanger'))+'</b><p class="muted">'+esc(t('sDangerD'))+'</p><button class="btn danger" id="sErase" style="margin-top:8px">'+esc(t('sDanger'))+'</button></div>';
  $('#p-set').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{D.settings.lang=b.dataset.l;save();renderAll();});
  $('#sMaS').onclick=()=>{const v=parseInt($('#sMa').value,10);if(v>0){D.settings.mala=v;save();toast(t('saved'));}};
  const collect=()=>{ms.forEach((m,i)=>{const n=$('[data-mn="'+i+'"]').value.trim();if(n)m.name=n;m.goal=Math.max(0,parseInt($('[data-mg="'+i+'"]').value,10)||0);});};
  $('#sSaveM').onclick=()=>{collect();save();toast(t('saved'));rSet();};
  $('#sAddM').onclick=()=>{collect();ms.push({id:'m'+uid(),name:'New mantra',goal:0});save();rSet();};
  $('#p-set').querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>confirmBox(t('sDelM'),()=>{collect();const i=+b.dataset.md;const id=ms[i].id;ms.splice(i,1);
    if(D.settings.curMantra===id)D.settings.curMantra=ms[0].id;save();rSet();},t('del'),true));
  $('#sErase').onclick=()=>confirmBox(t('sEraseQ'),()=>{const s=D.settings;D=defData();D.settings.lang=s.lang;save();toast(t('erased'));renderAll();},t('sDanger'),true);
}

/* ================= BACKUP / RESTORE ================= */
function doBackup(){const out={app:APPID,v:1,exported:new Date().toISOString(),counts:D.counts,log:D.log,
   settings:{mala:D.settings.mala,plan:D.settings.plan,schedMode:D.settings.schedMode,mantras:D.settings.mantras,lang:D.settings.lang}};
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='vajrayogini-backup-'+ymd()+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  D.settings.lastBackup=new Date().toISOString();save();toast(t('bkDone'));if(unlocked&&cur==='home')rHome();}
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;
  try{o=JSON.parse(r.result);}catch(x){return modal('<h3>⚠</h3><p>'+esc(t('rsBad'))+'</p>');}
  if(!o||o.app!==APPID||!Array.isArray(o.counts))return modal('<h3>⚠</h3><p>'+esc(t('rsBad'))+'</p>');
  const log=o.log&&typeof o.log==='object'?o.log:{};const ds=o.counts.map(c=>c.d).filter(Boolean).sort();
  const dupe=o.counts.filter(c=>D.counts.some(x=>x.id===c.id)).length;
  modal('<h3>'+esc(t('rsTitle'))+'</h3><p>'+esc(t('rsFile'))+': <b>'+esc(f.name)+'</b></p><ul style="margin:8px 0 8px 18px"><li>'+esc(t('rsCounts'))+': '+o.counts.length+' ('+nf(o.counts.reduce((a,c)=>a+(+c.n||0),0))+')</li><li>'+esc(t('rsDays'))+': '+Object.keys(log).length+'</li>'+
   (ds.length?'<li>'+esc(t('rsRange'))+': '+esc(fmtDate(ds[0]))+' – '+esc(fmtDate(ds[ds.length-1]))+'</li>':'')+'</ul><p class="muted">'+esc(t('rsMergeD'))+' ('+dupe+' ⟲)</p><p class="muted">'+esc(t('rsReplaceD'))+'</p>',
  [{l:t('cancel')},{l:t('rsReplace'),c:'danger',f:()=>{confirmBox(t('rsReplaceD'),()=>{restore(o,'replace');},t('rsReplace'),true);return false;}},{l:t('rsMerge'),c:'pri',f:()=>restore(o,'merge')}]);};
  r.readAsText(f);};
function cleanCount(c){return c&&c.id&&c.m&&c.d&&+c.n>0?{id:String(c.id),m:String(c.m),d:String(c.d),n:+c.n,src:c.src||'manual',ts:c.ts||new Date().toISOString()}:null;}
function restore(o,mode){const inC=o.counts.map(cleanCount).filter(Boolean);const inL=o.log&&typeof o.log==='object'?o.log:{};
  const inM=Array.isArray(o.settings&&o.settings.mantras)?o.settings.mantras.filter(m=>m&&m.id&&m.name):[];
  if(mode==='replace'){D.counts=inC;D.log=JSON.parse(JSON.stringify(inL));
    if(inM.length){D.settings.mantras=inM;if(!D.settings.mantras.some(m=>m.main))D.settings.mantras.unshift(DEF_MANTRAS[0]);}
    ['mala','plan','schedMode'].forEach(k=>{if(o.settings&&o.settings[k]!=null)D.settings[k]=o.settings[k];});save();toast(t('rsDoneR'));}
  else{const ids=new Set(D.counts.map(c=>c.id));let add=0;inC.forEach(c=>{if(!ids.has(c.id)){D.counts.push(c);ids.add(c.id);add++;}});
    Object.keys(inL).forEach(d=>{const src=inL[d]||{};if(!D.log[d])D.log[d]={plan:src.plan||D.settings.plan,done:Object.assign({},src.done||{})};
      else if(!D.log[d].plan||D.log[d].plan===src.plan)Object.keys(src.done||{}).forEach(k=>{if(src.done[k])D.log[d].done[k]=true;});});
    inM.forEach(m=>{if(!mantraById(m.id))D.settings.mantras.push({id:m.id,name:m.name,goal:+m.goal||0});});
    save();toast(t('rsDoneM')+' '+add+' '+t('rsNew'));}
  closeModal();renderAll();}
